[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
timeout = 30

addopts =
  --strict-markers
  --tb=short
  -q

markers =
  unit: Unit tests
  integration: Integration tests requiring DB and Redis
  performance: Performance benchmarks
  slow: Slow tests requiring AI models

filterwarnings =
  ignore::DeprecationWarning:passlib
  ignore::DeprecationWarning:jose
