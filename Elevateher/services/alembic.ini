# Alembic Configuration for ElevateHer
# Database: Neon PostgreSQL (wire protocol — standard asyncpg compatible)
# =============================================================================
# To initialize migrations in a new database:
#
#   1. Set environment variables:
#        export DATABASE_URL="postgresql://user:password@host/dbname"
#        export PYTHONPATH=services
#
#   2. Run the full migration:
#        cd services
#        python -m alembic upgrade head
#
#   3. Or run migrations via the web API:
#        GET /api/admin/migrations/run
#
# =============================================================================

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://postgres:password@localhost:5432/elevateher

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S