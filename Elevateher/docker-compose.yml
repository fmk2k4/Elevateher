services:
  db:
    image: pgvector/pgvector:pg16
    container_name: elevateher_db
    environment:
      POSTGRES_DB: elevateher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elevateher"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: elevateher_redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: elevateher_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
      DEBUG: ${DEBUG:-false}
      ENABLE_AGENTIC_LAYER: "false"
      ENABLE_QLORA_EMBEDDINGS: "false"
      N_GPU_LAYERS: "0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./models:/app/services/api/models
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # celery_worker removed — was duplicate of celery_main_worker with wrong import path
  # Canonical worker is celery_main_worker using services.api.tasks.celery_app from /app WORKDIR

  celery_safety_worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: elevateher_celery_safety
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./models:/app/services/api/models
      - ./logs:/app/logs
    command: celery -A services.api.tasks.celery_app worker --loglevel=info -Q safety -c 4

  celery_main_worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: elevateher_celery_main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./models:/app/services/api/models
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    working_dir: /app
    command: celery -A services.api.tasks.celery_app worker --loglevel=info -c 2 -Q default,sms,agent

  celery_beat:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: elevateher_celery_beat
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      DATABASE_URL_SYNC: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/elevateher
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services:/app/services
      - ./models:/app/services/api/models
      - ./logs:/app/logs
    command: celery -A services.api.tasks.celery_app beat --loglevel=info

  flower:
    image: mher/flower:2.0.1
    container_name: elevateher_flower
    command: ["flower", "--broker=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379", "--port=5555", "--basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?Set FLOWER_PASSWORD}"]
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: elevateher_web
    env_file:
      - .env
    environment:
      # VITE_ prefix required for Vite to expose vars to the browser bundle
      VITE_API_URL: http://localhost:8000
      # API_URL for SSR server-side calls (intra-container networking)
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    container_name: elevateher_dashboard
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://api:8000
      DASHBOARD_SERVICE_TOKEN: ${DASHBOARD_SERVICE_TOKEN:-}
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  default:
    # Rely on Docker's default network naming (project_name_default)
    # This prevents network name conflicts when using multiple project directories

volumes:
  pgdata:
  redisdata:
