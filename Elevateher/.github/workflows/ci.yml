name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  python-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: pytest tests/unit -q --tb=short

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci --legacy-peer-deps
      - name: Run web unit tests
        working-directory: apps/web
        run: npx vitest run
      - name: Build web app
        working-directory: apps/web
        run: npm run build

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: apps/dashboard
        run: npm ci
      - name: Lint dashboard
        working-directory: apps/dashboard
        run: npm run lint
      - name: Type-check dashboard
        working-directory: apps/dashboard
        run: npm run type-check
      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [web-build, dashboard-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # web.Dockerfile requires a local build artifact — build it first
      - name: Build web app for Docker
        working-directory: apps/web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Set up Docker Compose
        run: docker compose version

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for API to be healthy
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8000/health | grep -q "\"status\":\"healthy\""; do sleep 2; done'

      - name: Seed demo data
        run: docker exec elevateher_api python scripts/seed_demo_data.py

      - name: Install Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14
